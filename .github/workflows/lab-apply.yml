# R4 #29 row 11 - the `lab` environment consumption rule (T15 #10 d15;
# T06 #8 d4; T20 #22 d4). The apply job consumes exactly one approved
# encrypted saved plan, downloaded by immutable artifact id - never merely
# by name - and re-verifies every bound input (plan digest, summary digest,
# source commit, snapshot binding, expiry) BEFORE requesting any AWS
# credential. Any input change invalidates the authorization; a failed,
# canceled, or partial attempt never reuses the plan (one plan, one scope,
# one attempt - a retry requires a fresh lab-plan run and renewed
# authorization). Apply never re-plans.
#
# Authoring, not activation (T15 #10 d15 procedural interval): until R6 #31
# configures the `lab` environment (required reviewer, main-only branch
# rule, no bypass) and R7 #32 provisions the OIDC apply role and decryption
# secret, this workflow is necessarily inert - the preflights fail closed.
# The one referenced secret is LAB_PLAN_DECRYPTION_KEY, by name only
# (T15 #10 d9); role ARN and state bucket are GitHub variable names only.
name: lab

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Immutable artifact id of the approved applicable-saved-plan
        required: true
      source_commit:
        description: The exact main source commit the approved plan binds
        required: true
      summary_sha256:
        description: Approver-confirmed digest of the reviewed effective-access summary
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab-deployment
  cancel-in-progress: false

env:
  # Validator execution container (spec 8.1) - immutable multi-arch digest.
  CONTAINER: python:3.12.7-slim@sha256:60d9996b6a8a3689d36db740b49f4327be3be09a21122bd02fb8895abb38b50d
  TF_VERSION: "1.15.7"
  # terraform_1.15.7_linux_amd64.zip - official SHA256SUMS
  # (https://releases.hashicorp.com/terraform/1.15.7/), retrieved 2026-09-02.
  TF_ZIP_SHA256: "73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2"
  TF_LOG: ""
  TF_IN_AUTOMATION: "1"
  TERRAFORM_ROOT: infrastructure/identity-center
  STATE_KEY: aws-identity-access/lab/identity-center/terraform.tfstate

jobs:
  lab-apply:
    runs-on: ubuntu-24.04
    environment: lab
    env:
      LAB_APPLY_ROLE_ARN: ${{ vars.LAB_APPLY_ROLE_ARN }}
      LAB_STATE_BUCKET: ${{ vars.LAB_STATE_BUCKET }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      APPROVED_SUMMARY_SHA256: ${{ inputs.summary_sha256 }}
    steps:
      - name: Record the actual runner-image identity (spec 8.1 run evidence)
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/plan"
          echo "runner-image=${ImageOS:-unknown}-${ImageVersion:-unknown}" |
            tee "$RUNNER_TEMP/evidence/runner-identity.txt"

      - name: The consumption rule binds one exact main commit (input change invalidates)
        run: |
          test "$SOURCE_COMMIT" = "$GITHUB_SHA" || {
            echo "fail closed: main has moved past the approved source commit -"
            echo "the authorization is invalidated; produce a fresh lab-plan (T15 #10 d15)"
            exit 1
          }

      - name: Check out exactly the approved source commit (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Fail closed on missing activation prerequisites (R5/R6/R7)
        run: |
          fail() { echo "fail closed: $1"; exit 1; }
          test -n "$LAB_APPLY_ROLE_ARN" ||
            fail "LAB_APPLY_ROLE_ARN unset - R7 #32 provisions the OIDC apply role (T15 #10 d6)"
          test -n "$LAB_STATE_BUCKET" ||
            fail "LAB_STATE_BUCKET unset - R6/R7 configure the state backend reference (T15 #10 d16)"
          test -d "$TERRAFORM_ROOT" ||
            fail "$TERRAFORM_ROOT absent - R5 #30 authors the Terraform roots"
          test -f "$TERRAFORM_ROOT/.terraform.lock.hcl" ||
            fail "committed provider lock absent (spec 8.1; T21 #20 F2)"

      - name: Install Terraform 1.15.7 exact (spec 8.1; checksum-verified, fail closed)
        run: |
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "$TF_ZIP_SHA256  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tf"
          unzip -oq "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/tf"
          "$RUNNER_TEMP/tf/terraform" version | tee "$RUNNER_TEMP/evidence/terraform-version.txt"
          grep -q "Terraform v$TF_VERSION" "$RUNNER_TEMP/evidence/terraform-version.txt"

      - name: Download the approved plan by immutable artifact id (never by name)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/plan
          merge-multiple: true

      - name: Decrypt the approved saved plan (environment-gated material, T15 #10 d9)
        env:
          LAB_PLAN_DECRYPTION_KEY: ${{ secrets.LAB_PLAN_DECRYPTION_KEY }}
        run: |
          test -n "$LAB_PLAN_DECRYPTION_KEY" || {
            echo "fail closed: LAB_PLAN_DECRYPTION_KEY unset - R6 #31 registers the lab environment secret"
            exit 1
          }
          printf '%s\n' "$LAB_PLAN_DECRYPTION_KEY" > "$RUNNER_TEMP/decrypt.pem"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/decrypt.pem" \
            -in "$RUNNER_TEMP/plan/plan-key.bin.enc" \
            -out "$RUNNER_TEMP/plan/plan-key.bin" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/plan/tfplan.enc" -out "$RUNNER_TEMP/plan/tfplan" \
            -pass "file:$RUNNER_TEMP/plan/plan-key.bin"
          rm -f "$RUNNER_TEMP/decrypt.pem" "$RUNNER_TEMP/plan/plan-key.bin"

      - name: Export committed blobs and revisions (transport - git lives on the runner)
        run: python3 -m validator.ci export --out "$RUNNER_TEMP/export"
        env:
          PYTHONPATH: src

      - name: Download the hash-locked wheel set (the one pinned network step, spec 8.2)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/ci"
          -w /work "$CONTAINER"
          pip download --require-hashes -r src/requirements.txt -d /ci/wheels

      - name: Verify every bound input before any credential (fail closed, T06 #8 d4)
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP:/ci" -w /work -e PYTHONPATH=/work/src "$CONTAINER" \
            sh -ec "pip install --require-hashes --no-index --find-links /ci/wheels \
            -r src/requirements.txt && \
            python -m validator.ci verify-binding \
            --binding /ci/plan/authorization-binding.json \
            --plan-file /ci/plan/tfplan \
            --summary /ci/plan/effective-access-summary.md \
            --source-commit $SOURCE_COMMIT \
            --now $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUMMARY_SHA=$(sha256sum "$RUNNER_TEMP/plan/effective-access-summary.md" | cut -d' ' -f1)
          test "$SUMMARY_SHA" = "$APPROVED_SUMMARY_SHA256" || {
            echo "fail closed: the approver-confirmed summary digest does not match this artifact"
            exit 1
          }

      - name: Assume the apply role (OIDC; lab-environment-bound subject, T15 #10 d6)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.LAB_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Apply exactly the approved saved plan (one attempt; never re-planned)
        working-directory: infrastructure/identity-center
        run: |
          "$RUNNER_TEMP/tf/terraform" init -input=false -lockfile=readonly \
            -backend-config="bucket=$LAB_STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
          "$RUNNER_TEMP/tf/terraform" apply -input=false "$RUNNER_TEMP/plan/tfplan"

      - name: Publish terminal evidence digests (no plan bytes, no state)
        if: always()
        run: |
          (cd "$RUNNER_TEMP/plan" && sha256sum tfplan.enc plan-key.bin.enc \
            authorization-binding.json effective-access-summary.md \
            > "$RUNNER_TEMP/evidence/consumed-digests.txt") || true
          echo "outcome=$?" >> "$RUNNER_TEMP/evidence/apply-outcome.txt"

      - name: Upload terminal evidence (digests and identity only)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lab-apply-evidence
          path: |
            ${{ runner.temp }}/evidence/consumed-digests.txt
            ${{ runner.temp }}/evidence/apply-outcome.txt
            ${{ runner.temp }}/evidence/runner-identity.txt
            ${{ runner.temp }}/evidence/terraform-version.txt
          if-no-files-found: ignore
