# R4 #29 row 11 - the `plan-preview` required status check (T15 #10 d15;
# T20 #22 d1/d2/d4). The sanitized, snapshot-blind, non-authoritative
# PR-time rendering: fixture-alias-only, never eligible for apply under any
# circumstance, plus the T20 #22 d2 changed-path classification arms
# (uncovered paths and prohibited class combinations fail closed).
#
# This job holds no AWS identity, no environment, and no secret; it never
# reads the snapshot (T09 #12 d15). Pins and reproducibility exactly as in
# validate.yml (spec 8.1/8.2). Server-side activation as a required status
# check is R6 #31, separately authorized.
name: plan-preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plan-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Validator execution container (spec 8.1) - immutable multi-arch digest.
  CONTAINER: python:3.12.7-slim@sha256:60d9996b6a8a3689d36db740b49f4327be3be09a21122bd02fb8895abb38b50d

jobs:
  plan-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Record the actual runner-image identity (spec 8.1 run evidence)
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "runner-image=${ImageOS:-unknown}-${ImageVersion:-unknown}" |
            tee "$RUNNER_TEMP/evidence/runner-identity.txt"

      - name: Check out the reviewed commit (full history for last-touch revisions)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Compute the reviewed changed-path set (transport)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --name-only "$BASE_SHA...$HEAD_SHA"
          > "$RUNNER_TEMP/changed-paths.txt"

      - name: Export committed blobs and revisions (transport - git lives on the runner)
        run: python3 -m validator.ci export --out "$RUNNER_TEMP/export"
        env:
          PYTHONPATH: src

      - name: Download the hash-locked wheel set (the one pinned network step, spec 8.2)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/ci"
          -w /work "$CONTAINER"
          pip download --require-hashes -r src/requirements.txt -d /ci/wheels

      - name: Classify and render the sanitized preview (no network, snapshot-blind)
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work"
          -v "$RUNNER_TEMP:/ci" -w /work -e PYTHONPATH=/work/src "$CONTAINER"
          sh -ec 'pip install --require-hashes --no-index --find-links /ci/wheels
          -r src/requirements.txt &&
          python -m validator.ci plan-preview
          --export /ci/export --changed-paths /ci/changed-paths.txt
          --out /ci/evidence/plan-preview.md
          --findings /ci/evidence/plan-preview-findings.json'

      - name: Publish the sanitized preview (alias-only; never apply-eligible)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: plan-preview
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
